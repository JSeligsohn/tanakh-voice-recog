<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phoneme test bench</title>
<style>
  :root { --bg: #fafaf8; --card: #fff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e4e2dc; --ok: #1f7a4d; --okbg: #e6f4ec; --bad: #b3261e; --badbg: #fbeaea; --warn: #8a5a00; --warnbg: #fdf3dc; --accent: #2a5bd7; --rec: #d93025; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --card: #1f1f1d; --ink: #ecebe7; --muted: #a09f99; --line: #34332f; --ok: #6fd3a0; --okbg: #17382a; --bad: #ff8a80; --badbg: #3d1d1b; --warn: #f2c46d; --warnbg: #3a2e14; --accent: #8fb0ff; --rec: #ff6b5e; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  header h1 { margin: 0 0 2px; font-size: 18px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  #summary { margin-top: 6px; font-size: 13px; }
  main { max-width: 860px; margin: 0 auto; padding: 8px 16px 64px; }
  h2 { font-size: 16px; margin: 28px 0 4px; }
  .gnote { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .heb { font-family: "SBL Hebrew", "Taamey Frank CLM", "Times New Roman", serif; font-size: 28px; direction: rtl; line-height: 1.5; }
  .verse .heb { font-size: 22px; }
  .trad { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
  .take { display: grid; grid-template-columns: 64px 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0 0; border-top: 1px dashed var(--line); margin-top: 8px; }
  .kind { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .say { font-size: 15px; }
  .say b { font-weight: 600; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  button.rec { border-color: var(--rec); color: var(--rec); }
  button.recording { background: var(--rec); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .result { grid-column: 2 / 4; font-size: 13px; border-radius: 6px; padding: 6px 8px; }
  .result.ok { background: var(--okbg); color: var(--ok); }
  .result.bad { background: var(--badbg); color: var(--bad); }
  .heard { font-family: ui-monospace, Menlo, monospace; color: var(--muted); font-size: 12px; margin-top: 3px; word-break: break-word; }
  .heard button { padding: 0 6px; font-size: 12px; margin-left: 6px; }
  .rounds { margin: 12px 0 0; display: flex; gap: 8px; }
  .rounds button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .readers { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .rounds { flex-wrap: wrap; }
  .quiet { background: var(--warnbg); color: var(--warn); border-radius: 6px; padding: 6px 8px; margin-bottom: 4px; }
  @media (max-width: 560px) { .take { grid-template-columns: 1fr auto; } .kind { grid-column: 1 / 3; } .result { grid-column: 1 / 3; } }
</style>
</head>
<body>
<header>
  <h1>Phoneme test bench</h1>
  <p>Read each item twice: as written, and with the mistake. Click Record, read, click Stop. Recordings stay on this computer.</p>
  <div id="summary"></div>
</header>
<main id="list"></main>
<script type="module">
import { esc, NIKKUD, inWord, target, flagText } from '/flags.js'
const RATE = 16000
const MIC = { audio: { noiseSuppression: false, echoCancellation: false, autoGainControl: true, channelCount: 1 } }
let state, recorder = null, active = null

const caps = s => esc(s).replace(/\b([A-Z]{2,}[A-Z-]*)\b/g, '<b>$1</b>')
const tradLabel = t => (t === 'ashkenazic' ? 'Ashkenazic' : 'Sephardic')
let round = null
// Round 3 on keeps a take per reader, so an adult and a child can both record
let reader = 'adult'
try { reader = localStorage.getItem('bench-reader') || 'adult' } catch {}
const keyOf = (item, kind) => item.round >= 3 ? `${item.id}__${kind}__${reader}` : `${item.id}__${kind}`
const kindsOf = item => ['right', 'wrong'].filter(k => item[k])

function resultHtml(item, kind, r) {
  if (!r) return ''
  const heard = `<div class="heard">heard: ${esc(r.heard)} <button data-play="${esc(r.file)}">▶ play</button></div>`
  if (kind === 'right') {
    return r.ok
      ? `<div class="result ok">✓ No flags, as expected.${heard}</div>`
      : `<div class="result bad">✗ Flagged a correct reading: ${r.flags.map(flagText).join('; ')}.${heard}</div>`
  }
  const missed = r.missed ?? []
  const parts = []
  if (!item.flag.length) return `<div class="result ${r.ok ? 'ok' : 'bad'}">${r.ok ? `✓ No flags, as expected.${item.ungraded ? ` ${esc(item.ungraded)}` : ''}` : `✗ Flagged: ${r.flags.map(flagText).join('; ')}.`}${heard}</div>`
  const wanted = item.flag.filter(w => !missed.some(m => m.word === w.word && m.letter === w.letter && m.vowel === w.vowel && m.problem === w.problem))
  if (wanted.length) parts.push(`caught ${wanted.map(target).join(', ')}`)
  if (missed.length) parts.push(`missed ${missed.map(target).join(', ')}`)
  if (r.extra?.length) parts.push(`also flagged ${r.extra.map(flagText).join('; ')}`)
  return `<div class="result ${r.ok ? 'ok' : 'bad'}">${r.ok ? '✓' : '✗'} ${parts.join('. ')}.${heard}</div>`
}

const shown = () => state.items.filter(i => i.round === round)

function render() {
  const list = document.getElementById('list')
  const rounds = [...new Set(state.items.map(i => i.round))]
  const readers = round >= 3 ? `<span class="readers">Reader: ${['adult', 'child'].map(r => `<button data-reader="${r}" class="${r === reader ? 'on' : ''}">${r === 'adult' ? 'Adult' : 'Child'}</button>`).join(' ')}</span>` : ''
  const tabs = `<p class="rounds">${rounds.map(n => `<button data-round="${n}" class="${n === round ? 'on' : ''}">Round ${n}${n === state.latestRound ? ' (current)' : ''}</button>`).join(' ')}${readers}</p>`
  list.innerHTML = tabs + state.groups.map(g => {
    const its = shown().filter(i => i.group === g.id)
    if (!its.length) return ''
    return `<h2>${esc(g.title)}</h2>${g.note ? `<p class="gnote">${esc(g.note)}</p>` : ''}` + its.map(i => `
      <div class="item ${i.pasuk || i.group === 'verse' ? 'verse' : ''}">
        <div class="top"><div class="heb">${esc(i.text)}</div><span class="trad">${tradLabel(i.trad)}</span></div>
        ${kindsOf(i).map(kind => `
          <div class="take">
            <span class="kind">${kind === 'right' ? 'As written' : i.flag.length ? 'Mistake' : i.ungraded ? 'Not graded' : 'Variation'}</span>
            <span class="say">${caps(i[kind])}</span>
            <button class="rec" data-id="${i.id}" data-kind="${kind}">${state.results[keyOf(i, kind)] ? 'Redo' : '● Record'}</button>
            ${resultHtml(i, kind, state.results[keyOf(i, kind)])}
          </div>`).join('')}
      </div>`).join('')
  }).join('')
  summarize()
}

function summarize() {
  const takes = shown().flatMap(i => kindsOf(i).map(kind => ({ i, kind, r: state.results[keyOf(i, kind)] })))
  const done = takes.filter(t => t.r)
  const wrong = done.filter(t => t.kind === 'wrong' && t.i.flag.length), right = done.filter(t => !(t.kind === 'wrong' && t.i.flag.length))
  const n = ts => ts.filter(t => t.r.ok).length
  const quiet = lastPeak !== null && lastPeak < 0.1
    ? `<div class="quiet">That take was very quiet (its loudest moment was ${Math.round(lastPeak * 100)}% of full volume). Check the microphone in System Settings → Sound → Input: the right device selected, and the input volume turned up. Speak at a normal distance from it.</div>` : ''
  document.getElementById('summary').innerHTML = quiet +
    `Round ${round}${round >= 3 ? ` (${reader})` : ''}: ${done.length} of ${takes.length} recorded · mistakes caught: <b>${n(wrong)}/${wrong.length}</b> · readings with no false flag: <b>${n(right)}/${right.length}</b>`
}

let lastPeak = null
async function toWav(blob) {
  const decoded = await new AudioContext().decodeAudioData(await blob.arrayBuffer())
  const off = new OfflineAudioContext(1, Math.ceil(decoded.duration * RATE), RATE)
  const src = off.createBufferSource(); src.buffer = decoded; src.connect(off.destination); src.start()
  const samples = (await off.startRendering()).getChannelData(0)
  lastPeak = samples.reduce((m, x) => Math.max(m, Math.abs(x)), 0)
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf)
  const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)))
  str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE'); str(12, 'fmt ')
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, RATE, true)
  v.setUint32(28, RATE * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, samples.length * 2, true)
  samples.forEach((s, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s)) * 0x7fff, true))
  return new Blob([buf], { type: 'audio/wav' })
}

async function start(btn) {
  const stream = await navigator.mediaDevices.getUserMedia(MIC)
  const chunks = []
  recorder = new MediaRecorder(stream, { audioBitsPerSecond: 128000 })
  recorder.ondataavailable = e => chunks.push(e.data)
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop())
    btn.textContent = 'Scoring…'; btn.classList.remove('recording')
    const { id, kind } = btn.dataset
    try {
      const wav = await toWav(new Blob(chunks, { type: recorder.mimeType }))
      const item = state.items.find(i => i.id === id)
      const r = await fetch(`/take?id=${id}&kind=${kind}${item.round >= 3 ? `&reader=${reader}` : ''}`, { method: 'POST', body: wav }).then(r => r.json())
      if (r.error) throw new Error(r.error)
      state.results[keyOf(item, kind)] = r
    } catch (e) { alert('Could not score this take: ' + e.message) }
    recorder = null; active = null
    render()
  }
  // Show "Stop" only once the recorder has really started, so the reader
  // doesn't begin before it (a Gen 1:1 take lost its first word that way)
  // (Safari doesn't always send the start event, so fall back to a timer)
  const ready = () => { if (active === btn && recorder) { btn.textContent = '■ Stop — read now'; btn.classList.add('recording') } }
  recorder.onstart = () => setTimeout(ready, 150)
  setTimeout(ready, 600)
  recorder.start()
  active = btn
  btn.textContent = 'Starting…'
  document.querySelectorAll('button.rec').forEach(b => { if (b !== btn) b.disabled = true })
}

// Play a take turned up to a normal level (most takes are recorded very
// quietly). The audio context starts inside the click, as Safari requires.
let ctx = null, playing = null
async function playTake(btn) {
  ctx ??= new AudioContext()
  ctx.resume()
  try { playing?.stop() } catch {}
  btn.textContent = '▶ loading…'
  try {
    const res = await fetch(`/audio?file=${encodeURIComponent(btn.dataset.play)}`)
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    const buf = await ctx.decodeAudioData(await res.arrayBuffer())
    const peak = buf.getChannelData(0).reduce((m, x) => Math.max(m, Math.abs(x)), 0) || 1
    const gain = ctx.createGain()
    gain.gain.value = Math.min(50, 0.9 / peak)
    const src = ctx.createBufferSource()
    src.buffer = buf
    src.connect(gain).connect(ctx.destination)
    src.onended = () => { btn.textContent = '▶ play' }
    src.start()
    playing = src
    btn.textContent = '▶ playing'
  } catch (err) {
    btn.textContent = '▶ play (failed)'
    btn.title = err.message
    console.error('playback', err)
  }
}

document.addEventListener('click', e => {
  const play = e.target.closest('[data-play]')
  if (play) { playTake(play); return }
  const tab = e.target.closest('[data-round]')
  if (tab) { round = +tab.dataset.round; render(); return }
  const who = e.target.closest('[data-reader]')
  if (who) { reader = who.dataset.reader; try { localStorage.setItem('bench-reader', reader) } catch {} render(); return }
  const btn = e.target.closest('button.rec')
  if (!btn) return
  if (active === btn && recorder) recorder.stop()
  else if (!recorder) start(btn).catch(err => alert('Microphone: ' + err.message))
})

state = await fetch('/state').then(r => r.json())
round = state.latestRound
render()
</script>
</body>
</html>
